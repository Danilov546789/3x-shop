version: "3.9"
services:
  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./vpnshop.db:/app/vpnshop.db

  webapp:
    build: .
    command: uvicorn webapp.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./vpnshop.db:/app/vpnshop.db
